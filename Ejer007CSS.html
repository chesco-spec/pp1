<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú Horizontal</title>

<style>
ul{
    list-style: none;   /* quita los puntos */
    padding: 0;
    margin: 0;
    background: gray;
    overflow: hidden;
}

li{
    float: left;        /* pone los elementos en fila */
    padding: 10px 20px;
}

li a{
    text-decoration: none;
    color: blue;
    font-family: Arial;
}
</style>

</head>
<body>

<ul>
    <li><a href="#">Archivo</a></li>
    <li><a href="#">Edición</a></li>
    <li><a href="#">Ver</a></li>
    <li><a href="#">Herramientas</a></li>
    <li><a href="#">Ayuda</a></li>
</ul>

</body>
</html>
